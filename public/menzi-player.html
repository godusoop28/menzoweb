<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <!--
    Página dedicada, servida realmente desde https://menzoweb.vercel.app (no generada in-process
    por el WebView con loadHtmlString/baseUrl) — ver MENZI_DJ_ARCHITECTURE.md en menzomovil. Un
    documento HTTP(S) real es lo que garantiza que el WebView de Android mande un HTTP Referer
    válido en los pedidos internos que el iframe de YouTube hace, que es justo lo que el error
    153 ("missing Referer/API client identity") de la YouTube IFrame Player API reclama cuando
    falta. Confirmado con curl que el header llega bien — sigue sin poder confirmarse en el
    propio Android WebView sin el `onError` real, que es lo que esta página ahora reporta
    completo (ver más abajo).
  -->
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>Menzi DJ Player</title>
  <style>
    html, body { margin: 0; padding: 0; background: #000; width: 100%; height: 100%; overflow: hidden; }
    #player { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="player"></div>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    var player = null;
    var ready = false;
    var pendingVideoId = null;
    var pendingStartSeconds = null;
    var requestedVideoId = null;
    var blockCheckTimer = null;

    // Soporte para abrir esta página directo en un browser normal (Chrome Android, para
    // comparar contra el WebView de la app) sin depender del bridge de Flutter — ver Fase 5 del
    // diagnóstico: ?videoId=xxx precarga un video, ?autoplay=0 deja el player mudo y detenido
    // hasta un toque real, para poder aislar autoplay como variable. Sin params, se comporta
    // exactamente igual que siempre (autoplay=1) para no afectar el uso real de Menzi DJ.
    var params = new URLSearchParams(window.location.search);
    var queryVideoId = params.get('videoId');
    var queryAutoplay = params.get('autoplay') !== '0';

    // Identidad de ESTA carga de página/reproductor — la pasa Flutter como query param al hacer
    // loadRequest (ver MenziDjNotifier.controller/YouTubeMobileDiagnosticScreen, cada uno genera
    // la suya). Viaja en TODO mensaje del bridge para que Dart pueda confirmar, mensaje a mensaje,
    // que sigue escuchando a la instancia que él mismo creó — y no a un WebView/iframe viejo que
    // haya quedado vivo por accidente (recarga, hot reload, una segunda carga inesperada). Si se
    // abre esta página suelta en un browser (sin Flutter, sin query param) se genera una random
    // acá mismo, solo para que el resto del código tenga algo consistente que mandar.
    var instanceId = params.get('instanceId') || ('standalone-' + Math.random().toString(36).slice(2));
    console.log('[MenziDJPlayer][instance:' + instanceId + '] page loaded');
    if (params.get('debugLabel') === '1') {
      var label = document.createElement('div');
      label.textContent = 'Instance: ' + instanceId;
      label.style.cssText = 'position:fixed;top:2px;left:2px;z-index:9999;background:rgba(0,0,0,.7);' +
        'color:#0f0;font:10px monospace;padding:2px 4px;pointer-events:none;';
      document.body.appendChild(label);
    }

    // Diagnóstico seguro — nunca imprime tokens/claves, solo el origin/URL/UA de la propia
    // página, que es justo lo que hay que poder confirmar cuando aparece un error 153.
    console.log('[MenziDJPlayer] pageUrl=' + window.location.href);
    console.log('[MenziDJPlayer] documentOrigin=' + window.location.origin);
    // `origin` en playerVars se toma de window.location.origin más abajo, nunca de un string
    // hardcodeado aparte — así este log y el que realmente se manda a YouTube SIEMPRE coinciden
    // por construcción, sin riesgo de que el origin configurado se desincronice del real.
    console.log('[MenziDJPlayer] configuredOrigin=' + window.location.origin);
    console.log('[MenziDJPlayer] documentReferrer=' + document.referrer);
    console.log('[MenziDJPlayer] userAgent=' + navigator.userAgent);

    function post(message) {
      message.instanceId = instanceId;
      message.timestamp = Date.now();
      if (window.MenziBridge) {
        window.MenziBridge.postMessage(JSON.stringify(message));
      }
    }

    // Una excepción dentro de cualquiera de estos NUNCA debe impedir que un onError/
    // autoplayBlocked salga — sin esto, un getVolume()/isMuted() que tire (p. ej. el player
    // todavía no terminó de inicializar del todo pese a reportar ready) se tragaba el evento
    // entero y el bridge no mandaba nada, dejando a Dart sin ninguna pista de qué pasó.
    function safeGetState() { try { return player ? player.getPlayerState() : null; } catch (e) { return null; } }
    function safeIsMuted() { try { return player ? player.isMuted() : null; } catch (e) { return null; } }
    function safeGetVolume() { try { return player ? player.getVolume() : null; } catch (e) { return null; } }
    function safeGetCurrentTime() { try { return player ? player.getCurrentTime() : null; } catch (e) { return null; } }
    function safeGetVideoData() {
      try { return player ? player.getVideoData() : null; } catch (e) { return null; }
    }

    // No basta con llamar playVideo()/unMute() y asumir que ya suena — un WebView/OEM que
    // ignore la configuración de "no requiere gesto del usuario" puede aceptar el comando en
    // silencio sin que el audio realmente arranque. Este margen le da tiempo al player de pasar
    // por BUFFERING legítimo antes de considerar que quedó bloqueado. [expectMuted] es lo que el
    // propio comando dejó pedido (un `mute` local del usuario nunca es "bloqueado" — mudo a
    // propósito no es un fallo); solo cuenta como bloqueado si, pese a esperar audio real, el
    // player queda parado, mudo o en volumen 0. Nunca se confunde con el error 153 (ver
    // onError): 153 es que YouTube rechazó el embed antes de que hubiera nada que reproducir.
    //
    // La YouTube IFrame Player API NO tiene un evento `onAutoplayBlocked` real — esto es una
    // detección propia (por eso `scheduleBlockCheck`, no un callback de `events` de YT.Player),
    // con el mismo payload enriquecido que pidió el diagnóstico para poder comparar ambos casos.
    function scheduleBlockCheck(expectMuted) {
      if (blockCheckTimer) clearTimeout(blockCheckTimer);
      blockCheckTimer = setTimeout(function () {
        blockCheckTimer = null;
        if (!player) return;
        var s = safeGetState();
        var muted = safeIsMuted();
        var volume = safeGetVolume();
        var stateOk = (s === 1 || s === 3);
        var muteOk = expectMuted || muted === false;
        var volumeOk = expectMuted || (typeof volume === 'number' && volume > 0);
        if (!stateOk || !muteOk || !volumeOk) {
          post({
            type: 'autoplayBlocked',
            requestedVideoId: requestedVideoId,
            playerState: s,
            muted: muted,
            volume: volume
          });
        }
      }, 2500);
    }

    function cancelBlockCheck() {
      if (blockCheckTimer) {
        clearTimeout(blockCheckTimer);
        blockCheckTimer = null;
      }
    }

    function loadVideo(videoId, startSeconds) {
      requestedVideoId = videoId;
      if (typeof startSeconds === 'number') {
        player.loadVideoById({ videoId: videoId, startSeconds: startSeconds });
      } else {
        player.loadVideoById(videoId);
      }
    }

    function onYouTubeIframeAPIReady() {
      // El script https://www.youtube.com/iframe_api solo debería invocar este callback global
      // una vez por documento — pero es un callback global (window.onYouTubeIframeAPIReady), así
      // que cualquier cosa que lo dispare dos veces en la misma página (una recarga del script
      // que no limpió el anterior, un bug futuro) terminaría creando un SEGUNDO div#player/iframe
      // superpuesto al primero sin que nada lo note. Esta guarda es la única defensa real posible
      // en este documento — la duplicación que se vio en el dispositivo (Fase de auditoría de
      // instancias) resultó ser dos WebViews DISTINTOS (el global de Menzi DJ + el de
      // diagnóstico, ver menzi_dj_player_host.dart/_diagnosticRoute), no dos YT.Player en el
      // mismo documento, pero esto cierra la otra mitad del riesgo igual.
      if (player) {
        post({ type: 'duplicatePlayerPrevented' });
        return;
      }
      player = new YT.Player('player', {
        width: '100%',
        height: '100%',
        playerVars: {
          autoplay: queryAutoplay ? 1 : 0,
          mute: 1,
          playsinline: 1,
          controls: 0,
          modestbranding: 1,
          rel: 0,
          origin: window.location.origin,
          enablejsapi: 1
        },
        events: {
          onReady: function () {
            ready = true;
            post({ type: 'ready' });
            if (queryVideoId) {
              loadVideo(queryVideoId);
            } else if (pendingVideoId) {
              loadVideo(pendingVideoId, pendingStartSeconds);
              pendingVideoId = null;
              pendingStartSeconds = null;
            }
          },
          onStateChange: function (event) {
            if (event.data === 1) cancelBlockCheck();
            post({
              type: 'stateChange',
              state: event.data,
              requestedVideoId: requestedVideoId,
              currentTime: safeGetCurrentTime(),
              muted: safeIsMuted(),
              volume: safeGetVolume()
            });
          },
          onError: function (event) {
            // 153 es un código real y documentado de la YouTube IFrame Player API — no una
            // invención ni algo propio de esta página: significa que YouTube rechazó el pedido
            // del embed por no poder identificar el origen/Referer del cliente. Se manda todo lo
            // que hace falta para confirmarlo desde el dispositivo real, sin adivinar ni
            // depender de curl desde otra máquina.
            var videoData = safeGetVideoData();
            post({
              type: 'error',
              errorCode: event.data,
              requestedVideoId: requestedVideoId,
              actualVideoId: videoData && videoData.video_id ? videoData.video_id : null,
              pageUrl: window.location.href,
              documentOrigin: window.location.origin,
              documentReferrer: document.referrer,
              userAgent: navigator.userAgent,
              playerState: safeGetState(),
              muted: safeIsMuted(),
              volume: safeGetVolume(),
              currentTime: safeGetCurrentTime()
            });
          }
        }
      });
    }

    window.handleMenziCommand = function (raw) {
      var msg;
      try { msg = JSON.parse(raw); } catch (e) { return; }
      if (!ready || !player) {
        if (msg.cmd === 'load') {
          pendingVideoId = msg.videoId;
          pendingStartSeconds = typeof msg.startSeconds === 'number' ? msg.startSeconds : null;
        }
        return;
      }
      switch (msg.cmd) {
        case 'load':
          // Con posición inicial en el mismo loadVideoById (en vez de cargar y mandar un seek
          // aparte inmediatamente después) evita una carrera entre dos llamadas JS separadas —
          // relevante sobre todo para quien entra tarde a una canción ya empezada.
          loadVideo(msg.videoId, msg.startSeconds);
          break;
        case 'play':
          player.playVideo();
          // `play` solo no cambia el mute — se evalúa contra lo que el player ya tenía.
          scheduleBlockCheck(safeIsMuted());
          break;
        case 'pause':
          cancelBlockCheck();
          player.pauseVideo();
          break;
        case 'seek':
          player.seekTo(msg.seconds, true);
          break;
        case 'mute':
          // Silencio LOCAL a propósito (el usuario o el estado inicial) — nunca es "bloqueado".
          cancelBlockCheck();
          player.mute();
          break;
        case 'unmute':
          player.unMute();
          if (typeof msg.volume === 'number') player.setVolume(msg.volume);
          scheduleBlockCheck(false);
          break;
        case 'volume':
          player.setVolume(msg.volume);
          break;
        case 'getTime':
          post({ type: 'time', seconds: safeGetCurrentTime(), state: safeGetState() });
          break;
        case 'getVideoData':
          post({
            type: 'videoData',
            requestedVideoId: requestedVideoId,
            state: safeGetState(),
            muted: safeIsMuted(),
            volume: safeGetVolume(),
            currentTime: safeGetCurrentTime()
          });
          break;
        case 'setRate':
          // Corrección suave de drift: un empujón de velocidad temporal en vez de un seek
          // audible para desincronizaciones chicas. setPlaybackRate ajusta al valor soportado
          // más cercano solo; no hace falta round-trip a getAvailablePlaybackRates() para este
          // uso (nunca se pide algo lejos de 1.0).
          player.setPlaybackRate(msg.rate);
          break;
      }
    };
  </script>
</body>
</html>
